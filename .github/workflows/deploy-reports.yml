
name: Deploy Reports

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Reports
        run: |
          chmod +x ./gradlew
          ./gradlew test javadoc

      - name: Prepare Reports
        run: |
          mkdir -p build/reports/javadoc

          JAVADOC_DIR=$(find build -type f -path '*/javadoc/index.html' -print -quit | xargs dirname)

          if [ -z "$JAVADOC_DIR" ]; then
            echo "Javadoc output directory was not found."
            exit 1
          fi

          cp -R "$JAVADOC_DIR/." build/reports/javadoc/

          if [ -f src/main/html/index.md ]; then
            cp src/main/html/index.md build/reports/index.md
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/reports
          publish_branch: gh-pages
