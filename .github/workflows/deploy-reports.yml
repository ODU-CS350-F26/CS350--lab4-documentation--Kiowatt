name: Deploy Reports

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Reports
        run: ./gradlew test javadoc

      - name: Prepare Reports
        run: |
          mkdir -p build/reports/javadoc
          cp -r build/docs/javadoc/. build/reports/javadoc/
          cp src/main/html/index.md build/reports/index.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/reports
          publish_branch: gh-pages
